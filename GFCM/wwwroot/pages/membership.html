<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memberships</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/site.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Memberships</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addMembershipModal">
        Enrol Member
      </button>
    </div>

    <!-- Expiring soon panel -->
    <div class="card mb-3" id="expiringPanel">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Expiring Soon</span>
        <div class="d-flex align-items-center gap-2">
          <label class="mb-0 small">Within</label>
          <input type="number" class="form-control form-control-sm" id="expiringDays" value="7" style="width:70px">
          <span class="small">days</span>
        </div>
      </div>
      <div class="card-body" id="expiringList">
        <div class="spinner-border spinner-border-sm"></div>
      </div>
    </div>

    <!-- Plan breakdown -->
    <div class="row g-3 mb-3" id="planBreakdown"></div>

    <!-- Spinner / empty state -->
    <div id="loadingSpinner" class="text-center my-4">
      <div class="spinner-border"></div>
    </div>
    <div id="emptyState" class="alert alert-info d-none">No memberships found.</div>

    <!-- Table -->
    <table class="table table-hover table-striped" id="membershipTable">
      <thead>
        <tr>
          <th>Member</th>
          <th>Plan</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Status</th>
          <th>Days Remaining</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="membershipTableBody"></tbody>
    </table>
  </div>

  <!-- Enrol Modal -->
  <div class="modal fade" id="addMembershipModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Enrol Member</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Member</label>
            <select class="form-select" id="addMembershipUser"></select>
          </div>
          <div class="mb-2">
            <label class="form-label">Plan</label>
            <select class="form-select" id="addMembershipPlan"></select>
          </div>
          <div class="alert alert-secondary small" id="endDatePreview"></div>
          <div id="addMembershipError" class="text-danger small d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="submitAddMembershipBtn">Enrol</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Renew Modal -->
  <div class="modal fade" id="renewMembershipModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Renew Membership</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="renewMembershipId">
          <div class="mb-2">
            <label class="form-label">Additional Days</label>
            <input type="number" class="form-control" id="renewAdditionalDays" min="1">
          </div>
          <div class="d-flex gap-2 mb-2">
            <button type="button" class="btn btn-outline-secondary btn-sm quick-pick" data-days="30">+30</button>
            <button type="button" class="btn btn-outline-secondary btn-sm quick-pick" data-days="90">+90</button>
            <button type="button" class="btn btn-outline-secondary btn-sm quick-pick" data-days="365">+365</button>
          </div>
          <div class="alert alert-secondary small" id="renewEndDatePreview"></div>
          <div id="renewError" class="text-danger small d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="submitRenewBtn">Renew</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Status Modal -->
  <div class="modal fade" id="statusMembershipModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Change Status</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="statusMembershipId">
          <select class="form-select" id="statusSelect">
            <option value="Active">Active</option>
            <option value="Expired">Expired</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="submitStatusBtn">Update</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal fade" id="deleteMembershipModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete Membership</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete this membership?
          <input type="hidden" id="deleteMembershipId">
          <div id="deleteConflictBox" class="alert alert-warning d-none mt-2"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteMembershipBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/membership.js"></script>
</body>
</html>
