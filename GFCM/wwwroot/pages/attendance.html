<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance GFCM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/site.css" rel="stylesheet">
</head>
<body>
    <div id="navbar"></div>

    <!-- filter row -->
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Attendance</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
                Add Attendance
            </button>
        </div>
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="filterDate" class="form-label">
                            Date
                        </label>
                        <input type="date" id="filterDate" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label for="filterDate" class="form-label">
                            Branch ID
                        </label>
                        <input type="number" id="filterBranchID" class="form-control" placeholder="Enter Branch ID">
                    </div>
                    <div class="col-md-4">
                        <label for="filterMemberID" class="form-label">
                            Member ID
                        </label>
                        <input type="number" id="filterUserId" class="form-control" placeholder="Enter member ID">
                    </div>
                    <div class="col-md-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="currentlyInFilter">
                            <label class="form-check-label" for="currentlyInFilter">
                                Currently in GYM
                            </label>
                        </div>
                    </div>
                    <div class="col-md-8 text-md-end">
                        <button class="btn btn-primary me-2" onclick="applyFilters()">
                            Filter
                        </button>
                        <button class="btn btn-secondary" onclick="clearFilters()">
                            Clear
                        </button>
                    </div>
                </div>
            </div>
            <!-- attendance table -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Attendance Records</h5>
                </div>
                <div class="card-body">
                    <div id="loadingSpinner" class="text-center py-4">
                        <div class="spinner-border" role="status">
                            <span class="visualy-hidden">
                            </span>
                        </div>
                        <p class="mt-2 mb-0">
                            Loading attendance...
                        </p>
                    </div>
                    <div id="emptyState" class="text-center py-4 d-none">
                        <p class="text-muted mb-0">
                            No attendance records found.
                        </p>
                    </div>
                    <!-- Table -->

                </div>
            </div>

        </div>
       
        
        <!-- modals -->
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/branch.js"></script>
</body>
</html>
