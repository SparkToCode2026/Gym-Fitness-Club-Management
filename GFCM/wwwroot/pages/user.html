<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users — Gym Fitness Club Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/site.css" rel="stylesheet">
</head>
<body>
    <header id="navbar"></header>

    <main class="container pb-5">

        <div class="page-header">
            <h2>Users <span id="userCount" class="count"></span></h2>
            <button type="button" class="btn btn-primary" id="btnAddUser">Add user</button>
        </div>

        <!-- Case 12, role breakdown -->
        <section class="row g-3 mb-4" aria-label="Users by role">
            <div class="col-md-4">
                <div class="stat-card">
                    <span class="stat-label">Admins</span>
                    <span class="stat-value" id="countAdmin">0</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <span class="stat-label">Trainers</span>
                    <span class="stat-value" id="countTrainer">0</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <span class="stat-label">Members</span>
                    <span class="stat-value" id="countMember">0</span>
                </div>
            </div>
        </section>

        <!-- Case 12, role filter -->
        <section class="filter-bar" aria-label="Filter users">
            <div>
                <label for="filterRole" class="form-label">Role</label>
                <select class="form-select" id="filterRole">
                    <option value="">All roles</option>
                    <option value="Admin">Admin</option>
                    <option value="Trainer">Trainer</option>
                    <option value="Member">Member</option>
                </select>
            </div>
            <span id="filterResult" class="count align-self-center"></span>
        </section>

        <div class="table-wrap">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Specialization</th>
                        <th>Status</th>
                        <th class="table-actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>

    </main>

    <!-- Add user -->
    <div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="addUserForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Add user</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="addUserError" class="modal-error"></div>

                        <div class="mb-3">
                            <label for="addUserName" class="form-label">Full name</label>
                            <input type="text" class="form-control" id="addUserName" required>
                        </div>
                        <div class="mb-3">
                            <label for="addEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="addEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="addPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="addPassword" minlength="6" required>
                            <div class="form-hint">At least 6 characters.</div>
                        </div>
                        <div class="mb-3">
                            <label for="addPhone" class="form-label">Phone number</label>
                            <input type="text" class="form-control" id="addPhone">
                        </div>
                        <div class="mb-3">
                            <label for="addRole" class="form-label">Role</label>
                            <select class="form-select" id="addRole" required>
                                <option value="Member" selected>Member</option>
                                <option value="Trainer">Trainer</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Create user</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit user -->
    <div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="editUserForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit user</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="editUserError" class="modal-error"></div>
                        <input type="hidden" id="editUserId">

                        <div class="mb-3">
                            <label for="editUserName" class="form-label">Full name</label>
                            <input type="text" class="form-control" id="editUserName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editPhone" class="form-label">Phone number</label>
                            <input type="text" class="form-control" id="editPhone">
                        </div>
                        <div class="form-hint">Email, role and password are changed elsewhere.</div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Change role -->
    <div class="modal fade" id="roleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="roleForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Change role</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="roleError" class="modal-error"></div>
                        <input type="hidden" id="roleUserId">

                        <div class="mb-2">
                            <label for="newRole" class="form-label">Role</label>
                            <select class="form-select" id="newRole">
                                <option value="Member">Member</option>
                                <option value="Trainer">Trainer</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </div>
                        <div class="form-hint">User: <strong id="roleUserName"></strong></div>
                        <div class="form-hint d-none" id="trainerHint">
                            A trainer profile still has to be created separately.
                            <a href="trainer.html">Go to trainers</a>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Update role</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <aside id="toastHost" aria-live="polite"></aside>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/user.js"></script>
</body>
</html>
