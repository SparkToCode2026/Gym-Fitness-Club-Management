<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/site.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<div class="container py-4">
    <!-- Standardized Page Header -->
    <div class="page-header">
        <div class="d-flex align-items-baseline">
            <h2>Bookings</h2>
            <span class="count" id="resultCount"></span>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#bulkAttendModal">
                Mark All Attended
            </button>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBookingModal">
                Book a Class
            </button>
        </div>
    </div>
</div>

<!-- Case 12: Member / Status Filter Bar -->
<div class="filter-bar">
    <div>
        <label class="form-label">Member</label>
        <select id="filterMember" class="form-select form-select-sm">
            <option value="">All members</option>
        </select>
    </div>
    <div>
        <label class="form-label">Status</label>
        <select id="filterStatus" class="form-select form-select-sm">
            <option value="">Any status</option>
            <option value="Booked">Booked</option>
            <option value="Cancelled">Cancelled</option>
            <option value="Attended">Attended</option>
        </select>
    </div>
    <div class="d-flex gap-2 align-self-end">
        <button class="btn btn-sm btn-outline-secondary" id="btnApplyMemberFilter">Filter</button>
        <button class="btn btn-sm btn-outline-secondary" id="btnClearMemberFilter">Clear</button>
    </div>

    <!-- Case 07: Bookings Table -->
    <div class="table-wrap mb-4" id="bookingTableWrap">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Member</th>
                <th>Class</th>
                <th>Booking Date</th>
                <th>Status</th>
                <th class="table-actions">Actions</th>
            </tr>
            </thead>
            <tbody id="bookingTableBody"></tbody>
        </table>
    </div>

    <!-- Case 12: Popularity Panel -->
    <div class="card p-3">
        <h5 class="mb-3">Class Popularity</h5>
        <div class="table-wrap">
            <table class="table table-sm">
                <thead>
                <tr>
                    <th>Class</th>
                    <th class="num">Total Bookings</th>
                    <th class="num">Attended</th>
                    <th class="num">Attendance Rate</th>
                </tr>
                </thead>
                <tbody id="popularityBody"></tbody>
            </table>
        </div>
    </div>
</div>

</div>
</body>
</html>
