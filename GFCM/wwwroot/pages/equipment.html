<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/site.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Equipment</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addEquipmentModal">
        Add Equipment
      </button>
    </div>

    <!-- Filter row -->
    <div class="row g-2 mb-3">
      <div class="col-auto">
        <select class="form-select" id="branchFilter">
          <option value="">All Branches</option>
        </select>
      </div>
      <div class="col-auto">
        <select class="form-select" id="statusFilter">
          <option value="">All Statuses</option>
          <option value="Operational">Operational</option>
          <option value="UnderMaintenance">UnderMaintenance</option>
          <option value="Retired">Retired</option>
        </select>
      </div>
      <div class="col-auto">
        <button class="btn btn-outline-secondary" id="applyFilterBtn">Filter</button>
      </div>
      <div class="col-auto">
        <button class="btn btn-outline-secondary" id="clearFilterBtn">Clear</button>
      </div>
      <div class="col-auto d-flex align-items-center">
        <span id="resultCount" class="text-muted"></span>
      </div>
    </div>
    <div class="alert alert-info small" id="filterHint">
      Select both a branch and a status to filter. Selecting only one shows all records.
    </div>

    <!-- Status breakdown cards -->
    <div class="row g-3 mb-3" id="statusBreakdown"></div>

    <!-- Spinner / empty state -->
    <div id="loadingSpinner" class="text-center my-4">
      <div class="spinner-border"></div>
    </div>
    <div id="emptyState" class="alert alert-info d-none">No equipment found.</div>

    <!-- Table -->
    <table class="table table-hover table-striped" id="equipmentTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Branch</th>
          <th>Purchase Date</th>
          <th>Quantity</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="equipmentTableBody"></tbody>
    </table>
  </div>

  <!-- Add Modal -->
  <div class="modal fade" id="addEquipmentModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Equipment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" id="addEquipmentName">
          </div>
          <div class="mb-2">
            <label class="form-label">Branch</label>
            <select class="form-select" id="addEquipmentBranch"></select>
          </div>
          <div class="mb-2">
            <label class="form-label">Purchase Date</label>
            <input type="date" class="form-control" id="addEquipmentDate">
          </div>
          <div class="mb-2">
            <label class="form-label">Quantity</label>
            <input type="number" class="form-control" id="addEquipmentQuantity" min="1">
          </div>
          <div id="addEquipmentError" class="text-danger small d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="submitAddEquipmentBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal fade" id="editEquipmentModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Equipment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editEquipmentId">
          <div class="mb-2">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" id="editEquipmentName">
          </div>
          <div class="mb-2">
            <label class="form-label">Quantity</label>
            <input type="number" class="form-control" id="editEquipmentQuantity" min="0">
          </div>
          <div id="editEquipmentError" class="text-danger small d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="submitEditEquipmentBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Decommission Confirm Modal -->
  <div class="modal fade" id="decommissionModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Decommission Equipment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to retire this equipment record?
          <input type="hidden" id="decommissionId">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDecommissionBtn">Retire</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/equipment.js"></script>
</body>
</html>
