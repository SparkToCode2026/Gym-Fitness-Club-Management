<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/site.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<div class="container py-4">
    <!-- Standardized Page Header -->
    <div class="page-header">
        <div class="d-flex align-items-baseline">
            <h2>Payments</h2>
            <span class="count" id="resultCount"></span>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPaymentModal">
            Record Payment
        </button>
    </div>

    <!-- Case 18: Stat Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-label">Confirmed Revenue (Overall)</div>
                <div class="stat-value" id="totalRevenueFigure">-</div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="stat-card">
                <div class="stat-label">Filtered Revenue</div>
                <div class="stat-value" id="filteredRevenueFigure">-</div>
                <div class="form-hint" id="filteredRevenueLabel"></div>
            </div>
        </div>
    </div>

    <!-- Case 18: Filter Bar -->
    <div class="filter-bar mb-3">
        <div>
            <label class="form-label">From</label>
            <input type="date" id="filterFrom" class="form-control form-control-sm">
        </div>
        <div>
            <label class="form-label">To</label>
            <input type="date" id="filterTo" class="form-control form-control-sm">
        </div>
        <div>
            <label class="form-label">Method</label>
            <select id="filterMethod" class="form-select form-select-sm">
                <option value="">Any</option>
                <option value="Card">Card</option>
                <option value="Cash">Cash</option>
                <option value="Transfer">Transfer</option>
            </select>
        </div>
        <div>
            <label class="form-label">Status</label>
            <select id="filterStatus" class="form-select form-select-sm">
                <option value="">Any</option>
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
                <option value="Failed">Failed</option>
                <option value="Refunded">Refunded</option>
            </select>
        </div>
        <div class="d-flex gap-2 align-self-end">
            <button class="btn btn-sm btn-outline-secondary" id="btnApplyFilter">Filter</button>
        </div>
    </div>

    <div class="d-flex gap-2 mb-4">
        <button class="btn btn-sm btn-outline-primary" id="presetMonth">This month</button>
        <button class="btn btn-sm btn-outline-primary" id="presetLastMonth">Last month</button>
        <button class="btn btn-sm btn-outline-primary" id="presetYear">This year</button>
        <button class="btn btn-sm btn-outline-secondary" id="btnClearFilter">Clear</button>
    </div>

    <!-- Case 13: Payments Table -->
    <div class="table-wrap mb-4" id="paymentTableWrap">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Payer</th>
                <th>Membership</th>
                <th class="num">Amount</th>
                <th class="num">Date</th>
                <th>Method</th>
                <th>Status</th>
                <th class="table-actions">Actions</th>
            </tr>
            </thead>
            <tbody id="paymentTableBody"></tbody>
        </table>
    </div>

    <!-- Case 18: Monthly Breakdown Panel -->
    <div class="card p-3">
        <h5 class="mb-3">Monthly Breakdown (All-Time Completed)</h5>
        <div class="table-wrap">
            <table class="table table-sm mb-0">
                <thead>
                <tr>
                    <th>Month</th>
                    <th class="num">Total</th>
                </tr>
                </thead>
                <tbody id="monthlyBreakdownBody"></tbody>
            </table>
        </div>
    </div>
    </div>
</div>

<!-- Case 14: Add Payment Modal -->
<div class="modal fade" id="addPaymentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Record Payment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="addPaymentAlert" class="modal-error"></div>
                <div class="mb-2">
                    <label class="form-label">Member</label>
                    <select id="addPaymentMember" class="form-select"></select>
                </div>
                <div class="mb-2">
                    <label class="form-label">Membership (optional)</label>
                    <select id="addPaymentMembership" class="form-select">
                        <option value="">None</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label">Amount</label>
                    <input type="number" id="addPaymentAmount" class="form-control" min="0.01" step="0.01">
                </div>
                <div class="mb-2">
                    <label class="form-label">Method</label>
                    <select id="addPaymentMethod" class="form-select">
                        <option value="Card">Card</option>
                        <option value="Cash">Cash</option>
                        <option value="Transfer">Transfer</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnSubmitAddPayment">Record Payment</button>
            </div>
        </div>
    </div>
</div>

<!-- Case 15: Edit Payment Modal -->
<div class="modal fade" id="editPaymentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Payment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="editPaymentAlert" class="modal-error"></div>
                <input type="hidden" id="editPaymentId">
                <div class="mb-2">
                    <label class="form-label">Amount</label>
                    <input type="number" id="editPaymentAmount" class="form-control" min="0.01" step="0.01">
                </div>
                <div class="mb-2">
                    <label class="form-label">Method</label>
                    <select id="editPaymentMethod" class="form-select">
                        <option value="Card">Card</option>
                        <option value="Cash">Cash</option>
                        <option value="Transfer">Transfer</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnSubmitEditPayment">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<!-- FIX : Load auth.js before nav.js  -->
<!-- FIX : added the missing script tags -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/payment.js"></script>

</body>
</html>
