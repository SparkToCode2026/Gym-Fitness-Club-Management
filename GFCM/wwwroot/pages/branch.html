<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Branches — Gym Fitness Club Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/site.css" rel="stylesheet">
</head>
<body>
    <header id="navbar"></header>

    <main class="container pb-5">

        <div class="page-header">
            <h2>Branches <span id="branchCount" class="count"></span></h2>
            <button type="button" class="btn btn-primary" id="btnAddBranch">Add branch</button>
        </div>

        <!-- Case 07 filter -->
        <section class="filter-bar" aria-label="Filter branches">
            <div>
                <label for="filterCity" class="form-label">City</label>
                <input type="text" class="form-control" id="filterCity" placeholder="e.g. Muscat">
            </div>
            <button type="button" class="btn btn-primary" id="btnFilter">Search</button>
            <button type="button" class="btn btn-outline-secondary" id="btnClearFilter">Clear</button>
        </section>

        <div class="table-wrap mb-4">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>City</th>
                        <th>Address</th>
                        <th>Phone</th>
                        <th>Opening hours</th>
                        <th class="num">Trainers</th>
                        <th class="num">Equipment</th>
                        <th class="table-actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="branchTableBody"></tbody>
            </table>
        </div>

        <!-- Case 08 aggregate -->
        <section aria-label="Capacity report">
            <h3 class="h5 mb-3">Capacity report</h3>
            <div class="table-wrap">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Branch</th>
                            <th>City</th>
                            <th class="num">Trainers</th>
                            <th class="num">Equipment records</th>
                            <th class="num">Total units</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody"></tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Add / edit branch -->
    <div class="modal fade" id="branchModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="branchForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="branchModalTitle">Add branch</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="branchModalError" class="modal-error"></div>
                        <input type="hidden" id="branchId">

                        <div class="mb-3">
                            <label for="branchName" class="form-label">Branch name</label>
                            <input type="text" class="form-control" id="branchName" required>
                        </div>
                        <div class="mb-3">
                            <label for="branchCity" class="form-label">City</label>
                            <input type="text" class="form-control" id="branchCity" required>
                        </div>
                        <div class="mb-3">
                            <label for="branchAddress" class="form-label">Address</label>
                            <input type="text" class="form-control" id="branchAddress">
                        </div>
                        <div class="mb-3">
                            <label for="branchPhone" class="form-label">Phone</label>
                            <input type="text" class="form-control" id="branchPhone">
                        </div>

                        <!-- hidden when editing, update does not touch opening hours -->
                        <div class="mb-3" id="hoursFieldWrap">
                            <label for="branchHours" class="form-label">Opening hours</label>
                            <input type="text" class="form-control" id="branchHours" placeholder="Sun-Thu 06:00-23:00">
                            <div class="form-hint">Change these later with the <strong>Hours</strong> button.</div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Save branch</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Update opening hours -->
    <div class="modal fade" id="hoursModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="hoursForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Opening hours</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="hoursModalError" class="modal-error"></div>
                        <input type="hidden" id="hoursBranchId">
                        <div class="mb-2">
                            <label for="newOpeningHours" class="form-label">Opening hours</label>
                            <input type="text" class="form-control" id="newOpeningHours" required>
                        </div>
                        <div class="form-hint">Branch: <strong id="hoursBranchName"></strong></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Update hours</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <aside id="toastHost" aria-live="polite"></aside>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/branch.js"></script>
</body>
</html>
