<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trainers — Gym Fitness Club Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/site.css" rel="stylesheet">
</head>
<body>
    <header id="navbar"></header>

    <main class="container pb-5">

        <div class="page-header">
            <h2>Trainers <span id="trainerCount" class="count"></span></h2>
            <button type="button" class="btn btn-primary" id="btnAddTrainer">Add trainer profile</button>
        </div>

        <!-- Case 18 search and filter -->
        <section class="filter-bar" aria-label="Search trainers">
            <div>
                <label for="searchSpecialization" class="form-label">Specialization</label>
                <input type="text" class="form-control" id="searchSpecialization" placeholder="Search specialization...">
            </div>
            <div>
                <label for="filterBranch" class="form-label">Branch</label>
                <select class="form-select" id="filterBranch">
                    <option value="">All branches</option>
                </select>
            </div>
            <button type="button" class="btn btn-outline-secondary" id="btnClearSearch">Clear</button>
            <span id="searchResult" class="count align-self-center"></span>
        </section>

        <div class="table-wrap mb-4">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Trainer</th>
                        <th>Specialization</th>
                        <th class="num">Experience</th>
                        <th>Branch</th>
                        <th class="table-actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="trainerTableBody"></tbody>
            </table>
        </div>

        <!-- Case 18 sort -->
        <section aria-label="Most experienced">
            <h3 class="h5 mb-3">Most experienced</h3>
            <div class="table-wrap">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th class="num">#</th>
                            <th>Specialization</th>
                            <th class="num">Years of experience</th>
                        </tr>
                    </thead>
                    <tbody id="experienceTableBody"></tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Add trainer profile -->
    <div class="modal fade" id="addTrainerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="addTrainerForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Add trainer profile</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="addTrainerError" class="modal-error"></div>

                        <div class="mb-3">
                            <label for="addUserSelect" class="form-label">User</label>
                            <select class="form-select" id="addUserSelect" required></select>
                            <div class="form-hint">Only users with the Trainer role are listed.</div>
                        </div>
                        <div class="mb-3">
                            <label for="addBranchSelect" class="form-label">Branch</label>
                            <select class="form-select" id="addBranchSelect" required></select>
                        </div>
                        <div class="mb-3">
                            <label for="addSpecialization" class="form-label">Specialization</label>
                            <input type="text" class="form-control" id="addSpecialization" required>
                        </div>
                        <div class="mb-3">
                            <label for="addExperience" class="form-label">Years of experience</label>
                            <input type="number" class="form-control" id="addExperience" min="0" value="0" required>
                        </div>
                        <div class="mb-3">
                            <label for="addBio" class="form-label">Bio</label>
                            <textarea class="form-control" id="addBio" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="addCertification" class="form-label">Certification details</label>
                            <input type="text" class="form-control" id="addCertification">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Create profile</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit trainer profile -->
    <div class="modal fade" id="editTrainerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="editTrainerForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit trainer profile</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="editTrainerError" class="modal-error"></div>
                        <input type="hidden" id="editTrainerId">

                        <div class="mb-3">
                            <label for="editSpecialization" class="form-label">Specialization</label>
                            <input type="text" class="form-control" id="editSpecialization" required>
                        </div>
                        <div class="mb-3">
                            <label for="editExperience" class="form-label">Years of experience</label>
                            <input type="number" class="form-control" id="editExperience" min="0" required>
                        </div>
                        <div class="mb-3">
                            <label for="editBio" class="form-label">Bio</label>
                            <textarea class="form-control" id="editBio" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="editCertification" class="form-label">Certification details</label>
                            <input type="text" class="form-control" id="editCertification">
                        </div>
                        <div class="form-hint">The user and branch are changed elsewhere.</div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Transfer branch -->
    <div class="modal fade" id="transferModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="transferForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Transfer to another branch</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="transferError" class="modal-error"></div>
                        <input type="hidden" id="transferTrainerId">

                        <div class="mb-2">
                            <label for="transferBranchSelect" class="form-label">Branch</label>
                            <select class="form-select" id="transferBranchSelect" required></select>
                        </div>
                        <div class="form-hint">Trainer: <strong id="transferTrainerName"></strong></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Transfer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <aside id="toastHost" aria-live="polite"></aside>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/trainer.js"></script>
</body>
</html>
