<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body>
    <header id="navbar"></header>

    <main class="container py-4">
        <header class="page-header">
            <h2>Dashboard <span class="count">Overview</span></h2>
            <button class="btn btn-outline-primary" id="btnRefresh">Refresh</button>
        </header>

        <!-- three single-number cards -->
        <section class="row g-3 mb-4" aria-label="Key figures">
            <article class="col-md-4">
                <section class="stat-card">
                    <span class="stat-label">Confirmed Revenue</span>
                    <output id="revenueValue" class="stat-value d-block">&mdash;</output>
                    <small class="stat-note d-block">Total of all completed payments</small>
                    <a href="pages/payment.html" class="small">View Payments &rarr;</a>
                </section>
            </article>

            <article class="col-md-4">
                <section class="stat-card">
                    <span class="stat-label">Members</span>
                    <output id="membersValue" class="stat-value d-block">&mdash;</output>
                    <small class="stat-note d-block">Users with the Member role</small>
                    <a href="pages/user.html" class="small">View Users &rarr;</a>
                </section>
            </article>

            <article class="col-md-4">
                <section class="stat-card is-hold">
                    <span class="stat-label">Expiring Next 7 Days</span>
                    <output id="expiringValue" class="stat-value d-block">&mdash;</output>
                    <small class="stat-note d-block">Active memberships ending soon</small>
                    <a href="pages/membership.html" class="small">View Memberships &rarr;</a>
                </section>
            </article>
        </section>

        <!-- three breakdown tables -->
        <section class="row g-3 mb-4" aria-label="Breakdowns">
            <article class="col-lg-4">
                <figure class="table-wrap mb-0">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Users by Role</th>
                                <th class="text-end">Count</th>
                            </tr>
                        </thead>
                        <tbody id="rolesBody"></tbody>
                    </table>
                </figure>
            </article>

            <article class="col-lg-4">
                <figure class="table-wrap mb-0">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Memberships by Plan</th>
                                <th class="text-end">Active</th>
                            </tr>
                        </thead>
                        <tbody id="plansBody"></tbody>
                    </table>
                </figure>
            </article>

            <article class="col-lg-4">
                <figure class="table-wrap mb-0">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Equipment by Status</th>
                                <th class="text-end">Units</th>
                            </tr>
                        </thead>
                        <tbody id="equipmentBody"></tbody>
                    </table>
                </figure>
            </article>
        </section>

        <!-- two wider tables -->
        <section class="row g-3" aria-label="Reports">
            <article class="col-lg-6">
                <figure class="table-wrap mb-0">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Revenue by Month</th>
                                <th class="text-end">Amount</th>
                            </tr>
                        </thead>
                        <tbody id="monthlyBody"></tbody>
                    </table>
                </figure>
            </article>

            <article class="col-lg-6">
                <figure class="table-wrap mb-0">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Branch</th>
                                <th class="text-end">Avg. Daily Attendance</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceBody"></tbody>
                    </table>
                </figure>
            </article>
        </section>
    </main>

    <aside id="toastHost" aria-live="polite"></aside>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
