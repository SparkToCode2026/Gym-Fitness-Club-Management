<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body class="auth-page">

    <main class="auth-card">
        <header class="mb-4">
            <h1>Gym Fitness Club Manager</h1>
            <p class="sub">Please log in to your account</p>
        </header>
        
        <output id="loginAlert" class="alert alert-danger d-none text-center small mb-3" role="alert"></output>
        
        <form id="loginForm">
            <fieldset class="border-0 p-0 m-0">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold" id="btnLoginSubmit">Login</button>
            </fieldset>
        </form>
        
        <footer class="text-center mt-4">
            <span class="text-muted small">Don't have an account? </span>
            <a href="register.html" class="text-decoration-none small fw-semibold">Register here</a>
        </footer>
    </main>

    <aside id="toastHost" aria-live="polite"></aside>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
