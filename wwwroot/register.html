<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body class="auth-page">

    <main class="auth-card" style="max-width: 480px;">
        <header class="mb-3">
            <h1>Create an Account</h1>
            <p class="sub">Join the Gym Fitness Club</p>
        </header>
        
        <form id="registerForm">
            <fieldset class="border-0 p-0 m-0">
                <div class="mb-3">
                    <label for="userName" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="userName" placeholder="John Doe" required>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>
                
                <section class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" required>
                    </div>
                </section>
                
                <div class="mb-4">
                    <label for="role" class="form-label">Account Role</label>
                    <select class="form-select" id="role" required>
                        <option value="Member" selected>Member</option>
                        <option value="Trainer">Trainer</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 fw-bold" id="btnRegisterSubmit">Register Account</button>
            </fieldset>
        </form>
        
        <footer class="text-center mt-4">
            <span class="text-muted small">Already have an account? </span>
            <a href="login.html" class="text-decoration-none small fw-semibold">Login here</a>
        </footer>
    </main>

    <aside id="toastHost" aria-live="polite"></aside>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
